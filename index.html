<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>9Router Web — Multi-Provider AI Chat & Visual Router</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14151a">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <div class="backdrop" id="backdrop"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-logo">9R</div>
        <span>9Router Web</span>
      </div>
      <button class="icon-btn" id="btn-theme" title="تغییر تم">◐</button>
    </div>

    <button class="nav-item nav-new" id="btn-new-chat">＋ چت جدید</button>
    <button class="nav-item active" data-tab="chat">💬 گفتگو</button>
    <button class="nav-item" data-tab="providers">🔑 ارائه‌دهنده‌ها و کلیدها</button>
    <button class="nav-item" data-tab="combos">🔀 کمبو گرافیکی (نودها)</button>
    <button class="nav-item" data-tab="team">🤖 تیم ایجنت‌ها (Swarm)</button>
    <button class="nav-item" data-tab="arena">⚔️ مقایسه مدل‌ها (Arena)</button>

    <div class="sessions-head">تاریخچه گفتگوها</div>
    <input id="ses-search" class="hub-search" style="min-width:0;width:100%;padding:6px 10px;font-size:12.5px;margin-bottom:4px" placeholder="جستجو در گفتگوها...">
    <div class="sessions-list" id="sessions-list"></div>

    <div class="sidebar-foot">
      <button class="btn btn-sm btn-ghost" id="btn-settings">⚙️ تنظیمات</button>
      <button class="btn btn-sm btn-ghost" id="btn-export">⬇️ بکاپ</button>
      <button class="btn btn-sm btn-ghost" id="btn-import">⬆️ بازیابی</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
    </div>
  </aside>

  <!-- Main Workspace -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-g">
        <button class="icon-btn" id="btn-menu" title="منو">☰</button>
        <button class="target-pill" onclick="document.querySelector('[data-tab=combos]').click()">
          <span class="dot"></span>
          <span id="active-target-label">کمبو: Smart Default</span>
        </button>
      </div>
      <div class="topbar-g">
        <button class="btn btn-sm btn-ghost" onclick="document.querySelector('[data-tab=providers]').click()">+ کلید API</button>
      </div>
    </header>

    <!-- Chat View -->
    <section class="view active" id="view-chat">
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-col" id="chat-messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <div class="slash-menu" id="slash-menu"></div>
          <div class="composer-previews" id="composer-previews"></div>
          <div class="composer-row">
            <button class="icon-btn" id="btn-attach" title="پیوست تصویر یا فایل کد">📎</button>
            <input type="file" id="file-input" accept="image/*,.txt,.js,.ts,.py,.json,.md,.html,.css,.sql,.csv,.yaml,.yml,.xml" multiple style="display:none">
            <button class="icon-btn" id="btn-voice" title="ورودی صوتی (فارسی)">🎤</button>
            <button class="mode-pill" id="btn-img-mode" title="تولید یا ویرایش تصویر">🎨 تصویر</button>
            <textarea id="msg-input" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
            <button class="send-btn" id="send-btn" title="ارسال">↑</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Unified Providers & Keys Hub -->
    <section class="view" id="view-providers">
      <div class="page-scroll" id="providers-mount"></div>
    </section>

    <!-- Visual Node-Based Combo Builder -->
    <section class="view" id="view-combos">
      <div style="display:flex;flex-direction:column;flex:1;min-height:0" id="combos-mount"></div>
    </section>

    <!-- Visual Multi-Agent Team Orchestrator -->
    <section class="view" id="view-team">
      <div style="display:flex;flex-direction:column;flex:1;min-height:0" id="team-mount"></div>
    </section>

    <!-- Side-by-Side Arena -->
    <section class="view" id="view-arena">
      <div style="display:flex;flex-direction:column;flex:1;min-height:0" id="arena-mount"></div>
    </section>
  </main>
</div>

<!-- Live HTML Preview Modal -->
<div class="modal-bg" id="modal-preview">
  <div class="modal" style="max-width:920px;height:82vh">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>👁️ پیش‌نمایش زنده خروجی تیم</h3>
      <button class="btn btn-sm btn-ghost" data-close-modal>بستن ×</button>
    </div>
    <iframe id="preview-frame" sandbox="allow-scripts" style="flex:1;width:100%;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>
  </div>
</div>

<!-- Add Provider Modal -->
<div class="modal-bg" id="modal-prov">
  <div class="modal">
    <h3>افزودن ارائه‌دهنده سفارشی</h3>
    <div class="field"><label>نام ارائه‌دهنده</label><input id="m-prov-name" placeholder="مثلاً: CFRouter, AvalAI, Mistral"></div>
    <div class="field"><label>Base URL</label><input id="m-prov-url" placeholder="https://api.openai.com/v1" dir="ltr"></div>
    <div class="field"><label>مدل‌ها (هر سطر یک مدل)</label><textarea id="m-prov-models" rows="4" placeholder="gpt-4o-mini&#10;gpt-4o" dir="ltr"></textarea></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)">
      <input type="checkbox" id="m-prov-img"> پشتیبانی از تولید/ویرایش تصویر (/images)
    </label>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal>لغو</button>
      <button class="btn btn-amber" id="m-prov-save">ذخیره</button>
    </div>
  </div>
</div>

<!-- Add Key Modal -->
<div class="modal-bg" id="modal-key">
  <div class="modal">
    <h3>افزودن کلید API</h3>
    <input type="hidden" id="m-key-prov-id">
    <div class="field"><label>برچسب (اختیاری)</label><input id="m-key-label" placeholder="مثلاً: اکانت اصلی"></div>
    <div class="field"><label>کلید API</label><input id="m-key-val" type="password" placeholder="sk-... / AIza..." dir="ltr"></div>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal>لغو</button>
      <button class="btn btn-amber" id="m-key-save">ذخیره محلی</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="modal-settings">
  <div class="modal">
    <h3>تنظیمات مدل و شبکه</h3>
    <div class="field"><label>System Prompt</label><textarea id="s-sys" rows="3"></textarea></div>
    <div class="field"><label>Temperature (0.0 - 2.0)</label><input id="s-temp" type="number" step="0.1" min="0" max="2"></div>
    <div class="field"><label>CORS Proxy اختیاری (برای ارائه‌دهنده‌های بدون CORS)</label><input id="s-proxy" placeholder="https://your-worker.workers.dev/?url={url}" dir="ltr"></div>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal>لغو</button>
      <button class="btn btn-amber" id="s-save">ذخیره</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
