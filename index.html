<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>9Router Web - Multi-Provider AI Chat & Visual Router</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14151a">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <div class="backdrop" id="backdrop"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-logo">9R</div>
        <span>9Router Web</span>
      </div>
      <button class="icon-btn" id="btn-theme" type="button" title="تغییر تم" aria-label="تغییر تم">◐</button>
    </div>

    <button class="nav-item nav-new" id="btn-new-chat">＋ چت جدید</button>
    <button class="nav-item active" data-tab="chat">💬 گفتگو</button>
    <button class="nav-item" data-tab="providers">🔑 ارائه‌دهنده‌ها و کلیدها</button>
    <button class="nav-item" data-tab="combos">🔀 کمبو گرافیکی (نودها)</button>
    <button class="nav-item" data-tab="team">🤖 تیم ایجنت‌ها (Swarm)</button>
    <button class="nav-item" data-tab="arena">⚔️ مقایسه مدل‌ها (Arena)</button>
    <button class="nav-item" data-tab="analytics" data-view="analytics">📊 آمار و هزینه</button>

    <div class="sessions-head">تاریخچه گفتگوها</div>
    <input id="ses-search" class="hub-search" style="min-width:0;width:100%;padding:6px 10px;font-size:12.5px;margin-bottom:4px" placeholder="جستجو در گفتگوها..." aria-label="جستجو در گفتگوها">
    <div class="folder-bar" id="folder-bar" aria-label="فیلتر پوشه‌ها"></div>
    <div class="sessions-list" id="sessions-list"></div>

    <div class="sidebar-foot">
      <button class="btn btn-sm btn-ghost" id="btn-prompt-lib" type="button">📚 کتابخانه پرامپت‌ها</button>
      <button class="btn btn-sm btn-ghost" id="btn-settings" type="button">⚙️ تنظیمات</button>
      <button class="btn btn-sm btn-ghost" id="btn-export" type="button">⬇️ بکاپ</button>
      <button class="btn btn-sm btn-ghost" id="btn-import" type="button">⬆️ بازیابی</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
    </div>
  </aside>

  <!-- Main Workspace -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-g">
        <button class="icon-btn" id="btn-menu" type="button" title="منو" aria-label="باز کردن منو">☰</button>
        <button class="target-pill" id="topbar-target-pill" type="button">
          <span class="dot" aria-hidden="true"></span>
          <span id="active-target-label">کمبو: Smart Default</span>
        </button>
      </div>
      <div class="topbar-g">
        <button class="cmd-trigger-btn" id="btn-cmd-palette" type="button" title="جستجو و دستورات (Ctrl+K)" aria-label="باز کردن پالت دستورات">
          <span aria-hidden="true">⌘</span>
          <span>دستورات</span>
          <kbd class="cmd-kbd">Ctrl+K</kbd>
        </button>
        <button class="btn btn-sm btn-ghost" id="btn-export-md" type="button" title="خروجی Markdown گفتگو">MD</button>
        <button class="btn btn-sm btn-ghost" id="btn-export-html" type="button" title="خروجی HTML قابل چاپ / PDF">چاپ</button>
        <button class="btn btn-sm btn-ghost" id="btn-add-api-key" type="button">+ کلید API</button>
      </div>
    </header>

    <!-- Chat View -->
    <section class="view active" id="view-chat">
      <div class="chat-split" id="chat-split">
        <div class="chat-main">
          <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
            <div class="drop-overlay-card">
              <div class="drop-overlay-icon" aria-hidden="true">📎</div>
              <div class="drop-overlay-title">فایل یا تصویر را اینجا رها کنید</div>
              <div class="drop-overlay-sub">پشتیبانی از تصاویر و فایل‌های متنی / کد</div>
            </div>
          </div>

          <div class="chat-scroll" id="chat-scroll">
            <div class="chat-col" id="chat-messages"></div>
          </div>

          <button class="jump-bottom-btn" id="btn-jump-bottom" type="button" aria-label="پرش به آخرین پیام" title="پرش به پایین">
            <span aria-hidden="true">↓</span>
            <span>پرش به پایین</span>
          </button>

          <div class="composer-wrap">
            <div class="composer" id="composer">
              <div class="slash-menu" id="slash-menu" role="listbox" aria-label="پرامپت‌های آماده"></div>
              <div class="composer-previews" id="composer-previews"></div>

              <div class="composer-toolbar">
                <div class="popover-anchor">
                  <button class="composer-pill" id="btn-quick-model" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="popover-model">
                    <span class="dot" aria-hidden="true"></span>
                    <span id="quick-model-label">کمبو: Smart Default</span>
                    <span class="chev" aria-hidden="true">▾</span>
                  </button>
                  <div class="popover-panel" id="popover-model" role="dialog" aria-label="انتخاب سریع مدل یا کمبو"></div>
                </div>
                <span class="composer-pill free-quota-pill" id="free-quota-pill" hidden title="سهمیه روزانه تخمینی این مرورگر برای APIsFreeLLM (از ۱۰ میلیون توکن روزانه)"></span>

                <div class="popover-anchor">
                  <button class="composer-pill" id="btn-quick-params" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="popover-params" title="تنظیمات سریع دما و توکن">
                    <span aria-hidden="true">⚙</span>
                    <span id="quick-params-label">دما 0.7 · 4096</span>
                  </button>
                  <div class="popover-panel popover-params" id="popover-params" role="dialog" aria-label="پارامترهای سریع مدل">
                    <div class="popover-head">پارامترهای پاسخ</div>
                    <div class="param-row">
                      <div class="param-label-row">
                        <label for="qp-temp">Temperature (خلاقیت)</label>
                        <output id="qp-temp-val" for="qp-temp">0.7</output>
                      </div>
                      <input id="qp-temp" type="range" min="0" max="2" step="0.1" value="0.7">
                    </div>
                    <div class="param-row">
                      <div class="param-label-row">
                        <label for="qp-max-tokens">Max Tokens (حداکثر توکن)</label>
                      </div>
                      <input id="qp-max-tokens" type="number" min="128" max="65536" step="128" value="4096" dir="ltr">
                    </div>
                  </div>
                </div>

                <button class="composer-pill" id="btn-web-search" type="button" aria-pressed="false" title="جستجوی وب و استناد به منابع">
                  <span aria-hidden="true">🌐</span>
                  <span>جستجوی وب</span>
                </button>
              </div>

              <div class="composer-row">
                <button class="icon-btn" id="btn-attach" type="button" title="پیوست تصویر یا فایل کد" aria-label="پیوست تصویر یا فایل کد">📎</button>
                <button class="icon-btn" id="btn-attach-url" type="button" title="افزودن لینک صفحه وب" aria-label="افزودن لینک">🔗</button>
                <input type="file" id="file-input" accept="image/*,.txt,.js,.ts,.py,.json,.md,.html,.css,.sql,.csv,.yaml,.yml,.xml" multiple style="display:none">
                <button class="icon-btn" id="btn-voice" type="button" title="ورودی صوتی (فارسی)" aria-label="ورودی صوتی">🎤</button>
                <button class="mode-pill" id="btn-img-mode" type="button" aria-pressed="false" title="تولید یا ویرایش تصویر">🎨 تصویر</button>
                <textarea id="msg-input" rows="1" placeholder="پیام خود را بنویسید..." aria-label="متن پیام"></textarea>
                <button class="send-btn" id="send-btn" type="button" title="ارسال" aria-label="ارسال پیام">↑</button>
              </div>
            </div>
          </div>
        </div>

        <aside id="artifact-pane" class="artifact-pane" aria-hidden="true" aria-label="پنل پیش‌نمایش و ویرایش آرتیفکت"></aside>
      </div>
    </section>

    <!-- Unified Providers & Keys Hub -->
    <section class="view" id="view-providers">
      <div class="page-scroll" id="providers-mount"></div>
    </section>

    <!-- Visual Node-Based Combo Builder -->
    <section class="view" id="view-combos">
      <div style="display:flex;flex-direction:column;flex:1;min-height:0" id="combos-mount"></div>
    </section>

    <!-- Visual Multi-Agent Team Orchestrator -->
    <section class="view" id="view-team">
      <div style="display:flex;flex-direction:column;flex:1;min-height:0" id="team-mount"></div>
    </section>

    <!-- Side-by-Side Arena -->
    <section class="view" id="view-arena">
      <div style="display:flex;flex-direction:column;flex:1;min-height:0" id="arena-mount"></div>
    </section>

    <!-- Usage & Cost Analytics -->
    <section class="view" id="view-analytics">
      <div class="page-scroll" id="analytics-mount"></div>
    </section>
  </main>
</div>

<!-- Live HTML Preview Modal -->
<div class="modal-bg" id="modal-preview">
  <div class="modal" style="max-width:920px;height:82vh">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>👁️ پیش‌نمایش زنده خروجی تیم</h3>
      <button class="btn btn-sm btn-ghost" data-close-modal>بستن ×</button>
    </div>
    <iframe id="preview-frame" sandbox="allow-scripts" style="flex:1;width:100%;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>
  </div>
</div>

<!-- Add / Edit Provider Modal -->
<div class="modal-bg" id="modal-prov">
  <div class="modal">
    <h3 id="m-prov-title">افزودن ارائه‌دهنده</h3>
    <input type="hidden" id="m-prov-id">
    <div class="field"><label for="m-prov-name">نام ارائه‌دهنده</label><input id="m-prov-name" placeholder="مثلاً: CFRouter, AvalAI, Mistral"></div>
    <div class="field"><label for="m-prov-url">Base URL</label><input id="m-prov-url" placeholder="https://api.openai.com/v1" dir="ltr"></div>
    <div class="field"><label for="m-prov-apikey">کلید API (اختیاری - برای دریافت مدل‌ها و ذخیره هم‌زمان)</label><input id="m-prov-apikey" type="password" placeholder="sk-..." dir="ltr" autocomplete="off"></div>
    <div class="field"><label for="m-prov-default-model">مدل پیش‌فرض (اختیاری)</label><input id="m-prov-default-model" placeholder="مثلاً: gpt-4o-mini" dir="ltr"></div>
    <div class="field">
      <div class="field-label-row">
        <label for="m-prov-models">مدل‌ها (هر سطر یا با کاما)</label>
        <button class="btn btn-sm btn-ghost" id="m-prov-fetch-models" type="button">🔄 دریافت آنلاین مدل‌ها</button>
      </div>
      <div class="model-picker-status" id="m-prov-fetch-status" role="status" aria-live="polite" hidden></div>
      <div class="model-picker" id="m-prov-picker" hidden>
        <div class="model-picker-head">
          <input id="m-prov-picker-search" class="model-picker-search" type="search" placeholder="جستجو در بین مدل‌ها..." aria-label="جستجو در مدل‌های دریافت‌شده">
          <span class="model-picker-count" id="m-prov-picker-count"></span>
        </div>
        <div class="model-picker-list" id="m-prov-picker-list" role="listbox" aria-multiselectable="true" aria-label="لیست مدل‌های ارائه‌دهنده"></div>
      </div>
      <textarea id="m-prov-models" rows="4" placeholder="gpt-4o-mini&#10;gpt-4o" dir="ltr"></textarea>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)">
      <input type="checkbox" id="m-prov-img"> پشتیبانی از تولید/ویرایش تصویر (/images)
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)">
      <input type="checkbox" id="m-prov-nokey"> بدون نیاز به کلید API (سرور محلی)
    </label>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal>لغو</button>
      <button class="btn btn-amber" id="m-prov-save">ذخیره</button>
    </div>
  </div>
</div>

<!-- Add Key Modal -->
<div class="modal-bg" id="modal-key">
  <div class="modal">
    <h3>افزودن کلید API</h3>
    <input type="hidden" id="m-key-prov-id">
    <div class="field"><label>برچسب (اختیاری)</label><input id="m-key-label" placeholder="مثلاً: اکانت اصلی"></div>
    <div class="field"><label>کلید API</label><input id="m-key-val" type="password" placeholder="sk-... / AIza..." dir="ltr"></div>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal>لغو</button>
      <button class="btn btn-amber" id="m-key-save">ذخیره محلی</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="modal-settings">
  <div class="modal">
    <h3>تنظیمات مدل و شبکه</h3>
    <div class="field">
      <label for="s-sys-preset">پیش‌تنظیم System Prompt (از کتابخانه پرامپت‌ها)</label>
      <select id="s-sys-preset">
        <option value="">— انتخاب پیش‌تنظیم —</option>
      </select>
    </div>
    <div class="field"><label for="s-sys">System Prompt</label><textarea id="s-sys" rows="3"></textarea></div>
    <div class="field"><label for="s-temp">Temperature (0.0 - 2.0)</label><input id="s-temp" type="number" step="0.1" min="0" max="2"></div>
    <div class="field"><label for="s-proxy">CORS Proxy اختیاری (برای ارائه‌دهنده‌های بدون CORS)</label><input id="s-proxy" placeholder="https://your-worker.workers.dev/?url={url}" dir="ltr"></div>
    <div class="field">
      <label for="s-ws-provider">ارائه‌دهنده جستجوی وب (BYOK)</label>
      <select id="s-ws-provider">
        <option value="tavily">Tavily Search</option>
        <option value="serper">Serper (Google)</option>
        <option value="brave">Brave Search</option>
      </select>
    </div>
    <div class="field"><label for="s-ws-key">کلید API جستجوی وب</label><input id="s-ws-key" type="password" placeholder="tvly-... / Serper / Brave key" dir="ltr"></div>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal type="button">لغو</button>
      <button class="btn btn-amber" id="s-save" type="button">ذخیره</button>
    </div>
  </div>
</div>

<!-- Prompt Library Modal -->
<div class="modal-bg" id="modal-prompts">
  <div class="modal modal-wide">
    <div class="pl-header">
      <h3>📚 کتابخانه پرامپت‌ها</h3>
      <div class="pl-header-acts">
        <button class="btn btn-sm btn-ghost" id="pl-export" type="button">⬇️ خروجی JSON</button>
        <button class="btn btn-sm btn-ghost" id="pl-import" type="button">⬆️ ورودی JSON</button>
        <input type="file" id="pl-import-file" accept=".json" style="display:none">
        <button class="btn btn-sm btn-ghost" data-close-modal type="button">بستن ×</button>
      </div>
    </div>
    <div class="pl-toolbar">
      <input id="pl-search" class="hub-search" type="search" placeholder="جستجو در عنوان یا متن پرامپت..." aria-label="جستجو در پرامپت‌ها">
      <select id="pl-cat-filter" class="pl-select" aria-label="فیلتر دسته‌بندی"></select>
      <button class="btn btn-sm btn-amber" id="pl-new-btn" type="button">+ پرامپت جدید</button>
    </div>
    <form class="pl-editor" id="pl-editor" hidden>
      <input type="hidden" id="pl-edit-id">
      <div class="pl-editor-grid">
        <div class="field">
          <label for="pl-title">عنوان</label>
          <input id="pl-title" placeholder="مثلاً: خلاصه‌سازی مقاله" required>
        </div>
        <div class="field">
          <label for="pl-category">دسته‌بندی</label>
          <input id="pl-category" placeholder="عمومی، کدنویسی، ترجمه...">
        </div>
        <div class="field">
          <label for="pl-kind">نوع</label>
          <select id="pl-kind">
            <option value="prompt">پرامپت گفتگو (/)</option>
            <option value="system">پیش‌تنظیم System Prompt</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="pl-text">متن پرامپت (از {{متغیر}} برای فیلدهای قابل پر کردن استفاده کنید)</label>
        <textarea id="pl-text" rows="4" placeholder="متن پرامپت را بنویسید... مثلاً: این کد {{language}} را بررسی کن:" required></textarea>
      </div>
      <div class="modal-acts">
        <button class="btn btn-sm btn-ghost" id="pl-cancel-edit" type="button">انصراف</button>
        <button class="btn btn-sm btn-amber" id="pl-save-btn" type="submit">ذخیره پرامپت</button>
      </div>
    </form>
    <div class="pl-list" id="pl-list"></div>
  </div>
</div>

<!-- Prompt Variables Fill-in Modal -->
<div class="modal-bg" id="modal-prompt-vars">
  <div class="modal">
    <h3 id="pv-title">پر کردن متغیرهای پرامپت</h3>
    <div id="pv-fields" class="pv-fields"></div>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal type="button">لغو</button>
      <button class="btn btn-amber" id="pv-apply" type="button">درج در پیام</button>
    </div>
  </div>
</div>

<!-- Attach URL Modal -->
<div class="modal-bg" id="modal-url-attach">
  <div class="modal">
    <h3>🔗 افزودن لینک صفحه وب</h3>
    <div class="field">
      <label for="url-attach-input">آدرس صفحه (http:// یا https://)</label>
      <input id="url-attach-input" type="url" placeholder="https://example.com/article" dir="ltr">
    </div>
    <div class="url-attach-status" id="url-attach-status" role="status" aria-live="polite" hidden></div>
    <div class="modal-acts">
      <button class="btn btn-ghost" data-close-modal type="button">لغو</button>
      <button class="btn btn-amber" id="url-attach-submit" type="button">دریافت محتوا</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
